<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adibah Accounting Ledger Application</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0F3D33; --paper:#EEF3F0; --gold:#C8962E; }
  body { font-family:'Figtree',system-ui,sans-serif; background:var(--paper); color:#1b2b27; min-height:100vh; }
  .logo { font-family:'DM Serif Display',Georgia,serif; font-size:clamp(4rem,16vw,8rem); color:var(--ink); line-height:1; display:inline-block; padding-bottom:.1em; }
  /* double underline = accounting "final total" mark */
  .logo::after { content:""; display:block; height:7px; margin-top:.08em; border-top:2px solid var(--gold); border-bottom:2px solid var(--gold); }
  .subtitle { font-size:1.15rem; color:#4a5f58; }
  .panel { background:#fff; border:1px solid #cfdcd6; border-radius:10px; padding:1.5rem; }
  .btn-ink { background:var(--ink); color:#fff; border:0; }
  .btn-ink:hover { background:#0a2b24; color:#fff; }
  .form-control:focus,.form-select:focus { border-color:var(--ink); box-shadow:0 0 0 .2rem rgba(15,61,51,.18); }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  th { color:var(--ink); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="container py-5" style="max-width:760px">

  <!-- HEADER (always visible) -->
  <header class="text-center mb-5">
    <div class="logo">adibah</div>
    <p class="subtitle mt-3 mb-0">Adibah Accounting Ledger Application</p>
  </header>

  <!-- PAGE 1: choose department -->
  <section id="viewHome" class="panel mx-auto" style="max-width:420px">
    <label for="deptSelect" class="form-label fw-semibold">Choose your department</label>
    <select id="deptSelect" class="form-select form-select-lg">
      <option value="" selected disabled>Select department…</option>
      <option>Admin</option>
      <option>Sales</option>
      <option>Service/Technical</option>
      <option>Wing</option>
    </select>
  </section>

  <!-- PAGE 2: expense entry -->
  <section id="viewExpense" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 m-0">Expense entry <span class="text-secondary fw-normal">· <span id="deptName"></span></span></h2>
      <button id="btnBack" class="btn btn-outline-secondary btn-sm">Change department</button>
    </div>

    <form id="expenseForm" class="panel mb-4" autocomplete="off">
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label" for="fDate">Date</label>
          <input type="date" id="fDate" class="form-control" required>
        </div>
        <div class="col-6">
          <label class="form-label" for="fAmount">Amount (RM)</label>
          <input type="number" id="fAmount" class="form-control" min="0.01" step="0.01" placeholder="0.00" required>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label" for="fAccount">Expense type</label>
          <select id="fAccount" class="form-select" required>
            <option>Rent</option>
            <option>Salaries</option>
            <option>Utilities</option>
            <option>Transport</option>
            <option>Office Supplies</option>
            <option>Marketing</option>
            <option>Repairs & Maintenance</option>
            <option>Other Expenses</option>
          </select>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label" for="fPay">Paid using</label>
          <select id="fPay" class="form-select" required>
            <option>Cash</option>
            <option>Bank</option>
            <option>Accounts Payable</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="fDesc">Description</label>
          <input type="text" id="fDesc" class="form-control" placeholder="e.g. Paid electricity bill" required>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3 mt-4">
        <button type="submit" id="btnSave" class="btn btn-ink px-4">Save expense</button>
        <span id="msg" class="small" role="status"></span>
      </div>
    </form>

    <h3 class="h5">Recent journal lines</h3>
    <div class="panel p-0 table-responsive">
      <table class="table table-sm align-middle m-0">
        <thead><tr><th>Date</th><th>Description</th><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="text-center text-secondary py-3">No entries yet.</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
// 1) Paste your Apps Script Web app URL here (ends with /exec).
//    Leave empty to test locally (data saved in this browser only).
const API_URL =  "https://script.google.com/macros/s/AKfycbymKgi4UOC9tvV33GPy0e_0vEdwdhw-B7mvWPi-jY9orNK_5mUrSlxnE83Jqky1_Wdh/exec";

const $ = id => document.getElementById(id);
let dept = "";

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = n => n ? Number(n).toLocaleString('en-MY',{minimumFractionDigits:2}) : '';

function show(view) {
  $('viewHome').classList.toggle('hidden', view !== 'home');
  $('viewExpense').classList.toggle('hidden', view !== 'expense');
}

$('deptSelect').addEventListener('change', e => {
  dept = e.target.value;
  $('deptName').textContent = dept;
  $('fDate').value = new Date().toISOString().slice(0,10);
  show('expense');
  loadRows();
});

$('btnBack').addEventListener('click', () => {
  $('deptSelect').selectedIndex = 0;
  $('msg').textContent = '';
  show('home');
});

// ---- storage layer: Apps Script if API_URL set, else localStorage ----
async function apiList() {
  if (!API_URL) return JSON.parse(localStorage.getItem('adibah_lines') || '[]').filter(r => r.department === dept);
  const res = await fetch(API_URL + '?department=' + encodeURIComponent(dept));
  const data = await res.json();
  if (!data.ok) throw new Error(data.error);
  return data.rows;
}

async function apiSave(entry) {
  if (!API_URL) {
    const all = JSON.parse(localStorage.getItem('adibah_lines') || '[]');
    const base = { date:entry.date, department:entry.department, description:entry.description };
    all.push({ ...base, account:entry.account, debit:entry.amount, credit:0 });
    all.push({ ...base, account:entry.payAccount, debit:0, credit:entry.amount });
    localStorage.setItem('adibah_lines', JSON.stringify(all));
    return;
  }
  // text/plain avoids the CORS preflight that Apps Script cannot answer
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(entry)
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error);
}

async function loadRows() {
  try {
    const rows = (await apiList()).slice(-10).reverse();
    $('rows').innerHTML = rows.length
      ? rows.map(r => `<tr><td>${esc(String(r.date).slice(0,10))}</td><td>${esc(r.description)}</td><td>${esc(r.account)}</td><td class="num">${rm(r.debit)}</td><td class="num">${rm(r.credit)}</td></tr>`).join('')
      : '<tr><td colspan="5" class="text-center text-secondary py-3">No entries yet.</td></tr>';
  } catch (err) {
    $('rows').innerHTML = `<tr><td colspan="5" class="text-danger py-3">Could not load entries: ${esc(err.message)}</td></tr>`;
  }
}

$('expenseForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('btnSave'), msg = $('msg');
  const entry = {
    date: $('fDate').value,
    department: dept,
    description: $('fDesc').value.trim(),
    account: $('fAccount').value,        // debit side
    payAccount: $('fPay').value,         // credit side
    amount: parseFloat($('fAmount').value)
  };
  btn.disabled = true; msg.className = 'small text-secondary'; msg.textContent = 'Saving…';
  try {
    await apiSave(entry);
    msg.className = 'small text-success'; msg.textContent = 'Saved. Debit ' + entry.account + ', credit ' + entry.payAccount + '.';
    $('fDesc').value = ''; $('fAmount').value = '';
    loadRows();
  } catch (err) {
    msg.className = 'small text-danger'; msg.textContent = 'Could not save: ' + err.message;
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
